<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>د. عبدالرحمن النملان — المدفوعات | Dr. Abdulrahman Alnamlan — Payments</title>
<meta name="description" content="روابط دفع، بوابة دفع إلكتروني، نقاط بيع، فواتير ومحفظة — بواجهة واحدة."/>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/base.css">
<style>
  .hero{background:linear-gradient(135deg,#0EA5E9,#06B6D4);color:#fff;padding:64px 20px 72px;text-align:center}
  .hero h1{font-size:32px;font-weight:800;line-height:1.35;margin-bottom:14px}
  .hero p{font-size:16px;opacity:.92;max-width:600px;margin:0 auto 28px}
  .hero-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .hero .btn-ghost{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.4)}
  .wrap{max-width:1040px;margin:0 auto;padding:0 20px}
  .section{padding:56px 0}
  .section-head{text-align:center;margin-bottom:32px}
  .section-head h2{font-size:24px;font-weight:800;margin-bottom:8px}
  .section-head p{color:var(--muted);font-size:14px}
  .grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
  .service{background:var(--surface);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);border:1px solid var(--line)}
  .service-icon{width:44px;height:44px;border-radius:12px;background:var(--tint);display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:14px}
  .service h3{font-size:16px;font-weight:800;margin-bottom:6px}
  .service p{font-size:13px;color:var(--muted)}
  .service-tag{margin-top:12px;display:inline-block}
  .methods{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
  .method{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 18px;font-size:13px;font-weight:700;color:#475569;box-shadow:var(--shadow)}
  .demo{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:28px;border:1px solid var(--line)}
  .demo h2{font-size:20px;font-weight:800;margin-bottom:6px}
  .demo > p{color:var(--muted);font-size:14px;margin-bottom:18px}
  .demo-links{display:flex;flex-direction:column;gap:10px}
  .demo-link{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border:1.5px solid var(--line);border-radius:12px;text-decoration:none;transition:border-color .2s,background .2s}
  .demo-link:hover{border-color:var(--brand);background:var(--tint)}
  .demo-link-name{font-size:14px;font-weight:700}
  .demo-link-url{font-size:12px;color:var(--faint);direction:ltr;unicode-bidi:plaintext}
  .demo-link-go{font-size:13px;font-weight:800;color:var(--brand);white-space:nowrap}
  .steps{counter-reset:step;display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
  .step{background:var(--surface);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
  .step-num{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
  .step h3{font-size:15px;font-weight:800;margin-bottom:5px}
  .step p{font-size:13px;color:var(--muted)}
</style>
</head>
<body>

<div class="mock-banner" data-ar="وضع تجريبي — لا تتم أي عملية دفع حقيقية" data-en="Demo mode — no real payment is processed"></div>

<header class="site-header">
  <a class="brandmark" href="/">
    <span class="brandmark-dot">ع</span>
    <span>
      <span class="brandmark-main" data-ar="د. عبدالرحمن النملان" data-en="Dr. Abdulrahman Alnamlan"></span><br>
      <span class="brandmark-sub">PAYMENTS</span>
    </span>
  </a>
  <div style="display:flex;gap:10px;align-items:center">
    <a class="pill-btn" href="/dashboard" style="text-decoration:none" data-ar="لوحة التاجر" data-en="Merchant dashboard"></a>
    <button class="pill-btn" data-lang-toggle>EN</button>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <h1 data-ar="استقبل مدفوعاتك في قطر — بدون موقع وبدون برمجة"
        data-en="Take payments in Qatar — no website, no code"></h1>
    <p data-ar="أنشئ رابط دفع بعلامتك التجارية خلال دقيقة، وشاركه عبر واتساب أو إنستغرام أو رسالة نصية. المدفوعات، الفواتير والتقارير في لوحة واحدة."
       data-en="Create a branded payment link in a minute and share it on WhatsApp, Instagram, or SMS. Payments, invoices, and reporting in one dashboard."></p>
    <div class="hero-actions">
      <a class="btn btn-ghost" href="/dashboard" data-ar="أنشئ رابط دفع" data-en="Create a payment link"></a>
      <a class="btn btn-ghost" href="/p/consultation" data-ar="جرّب صفحة دفع" data-en="See a live payment page"></a>
    </div>
  </div>
</section>

<div class="wrap">

  <section class="section">
    <div class="section-head">
      <h2 data-ar="الخدمات" data-en="Services"></h2>
      <p data-ar="نفس مجموعة الخدمات التي تحتاجها العيادة أو المتجر" data-en="The same service lineup a clinic or a shop actually needs"></p>
    </div>
    <div class="grid">
      <div class="service">
        <div class="service-icon">🔗</div>
        <h3 data-ar="روابط الدفع" data-en="Payment links"></h3>
        <p data-ar="رابط قصير بعلامتك التجارية لكل خدمة أو منتج، بمبلغ ثابت أو مفتوح أو باقات." data-en="A short branded link per service or product — fixed amount, open amount, or plans."></p>
        <span class="badge badge-ok service-tag" data-ar="جاهز" data-en="Live"></span>
      </div>
      <div class="service">
        <div class="service-icon">💳</div>
        <h3 data-ar="بوابة الدفع الإلكتروني" data-en="Online payment gateway"></h3>
        <p data-ar="صفحة دفع مستضافة مع تحقق ثلاثي الأبعاد، وواجهة برمجية واحدة لإنشاء العملية والتحقق منها." data-en="A hosted checkout with 3-D Secure, and one API to create and verify a charge."></p>
        <span class="badge badge-warn service-tag" data-ar="محاكاة" data-en="Mocked"></span>
      </div>
      <div class="service">
        <div class="service-icon">🧾</div>
        <h3 data-ar="الفواتير" data-en="Invoicing"></h3>
        <p data-ar="حوّل أي رابط دفع إلى فاتورة برقم عملية وإيصال يصل للعميل بعد الدفع." data-en="Turn any payment link into an invoice with a transaction ID and a receipt for the payer."></p>
        <span class="badge badge-ok service-tag" data-ar="جاهز" data-en="Live"></span>
      </div>
      <div class="service">
        <div class="service-icon">📊</div>
        <h3 data-ar="لوحة التاجر" data-en="Merchant dashboard"></h3>
        <p data-ar="كل الروابط، المشاهدات، العمليات الناجحة والمرفوضة، والإجمالي المحصّل لكل عملة." data-en="Every link, its views, captured and declined transactions, and totals per currency."></p>
        <span class="badge badge-ok service-tag" data-ar="جاهز" data-en="Live"></span>
      </div>
      <div class="service">
        <div class="service-icon">🏪</div>
        <h3 data-ar="نقاط البيع" data-en="Point of sale"></h3>
        <p data-ar="رمز QR لكل رابط يُطبع ويوضع على الطاولة — يمسحه العميل ويدفع من هاتفه." data-en="A QR code per link to print and put on the counter — the customer scans and pays from their phone."></p>
        <span class="badge badge-ok service-tag" data-ar="جاهز" data-en="Live"></span>
      </div>
      <div class="service">
        <div class="service-icon">👛</div>
        <h3 data-ar="المحفظة" data-en="Wallet"></h3>
        <p data-ar="الدفع من رصيد المحفظة مباشرة دون إدخال بيانات بطاقة." data-en="Pay straight from a wallet balance with no card details to type."></p>
        <span class="badge badge-warn service-tag" data-ar="محاكاة" data-en="Mocked"></span>
      </div>
    </div>
  </section>

  <section class="section" style="padding-top:0">
    <div class="section-head">
      <h2 data-ar="طرق الدفع المدعومة" data-en="Supported payment methods"></h2>
      <p data-ar="نفس الطرق المتعارف عليها في السوق القطري" data-en="The methods the Qatari market actually uses"></p>
    </div>
    <div class="methods">
      <span class="method">NAPS</span>
      <span class="method">Visa</span>
      <span class="method">Mastercard</span>
      <span class="method">Apple&nbsp;Pay</span>
      <span class="method">Google&nbsp;Pay</span>
      <span class="method" data-ar="محفظة" data-en="Wallet"></span>
    </div>
  </section>

  <section class="section" style="padding-top:0">
    <div class="demo">
      <h2 data-ar="روابط جاهزة للتجربة" data-en="Links you can try right now"></h2>
      <p data-ar="هذه روابط تجريبية للدكتور عبدالرحمن النملان. افتح أياً منها لتجربة صفحة الدفع كاملة."
         data-en="Live links for Dr. Abdulrahman Alnamlan's clinic. Open any of them to walk the full checkout."></p>
      <div class="demo-links" id="demo-links"></div>
    </div>
  </section>

  <section class="section" style="padding-top:0">
    <div class="section-head">
      <h2 data-ar="كيف تعمل" data-en="How it works"></h2>
    </div>
    <div class="steps">
      <div class="step">
        <div class="step-num">١</div>
        <h3 data-ar="أنشئ الرابط" data-en="Create the link"></h3>
        <p data-ar="اسم الخدمة، المبلغ، لونك، والحقول التي تريد جمعها من العميل." data-en="Service name, amount, your colour, and the fields you want from the customer."></p>
      </div>
      <div class="step">
        <div class="step-num">٢</div>
        <h3 data-ar="شاركه" data-en="Share it"></h3>
        <p data-ar="انسخ الرابط أو رمز QR وضعه في البايو أو أرسله عبر واتساب." data-en="Copy the link or its QR code — put it in your bio or send it on WhatsApp."></p>
      </div>
      <div class="step">
        <div class="step-num">٣</div>
        <h3 data-ar="اقبض" data-en="Get paid"></h3>
        <p data-ar="يدفع العميل من هاتفه، وتظهر العملية فوراً في لوحتك." data-en="The customer pays from their phone and the transaction lands in your dashboard."></p>
      </div>
    </div>
  </section>

</div>

<footer class="site-footer">
  <div data-ar="عيادة د. عبدالرحمن النملان — نسخة توضيحية من منصة روابط الدفع" data-en="Dr. Abdulrahman Alnamlan — a demonstration payment-link platform"></div>
  <div data-ar="🇶🇦 بكل فخر صنع في قطر" data-en="🇶🇦 Proudly made in Qatar"></div>
  <div>© 2026</div>
</footer>

<script src="/assets/i18n.js"></script>
<script>
  // The landing page shows the demo links by slug rather than fetching the
  // merchant list, which is behind the dashboard passcode.
  var DEMOS = [
    { slug: 'consultation', ar: 'استشارة طبية — باقات', en: 'Medical consultation — plans' },
    { slug: 'online-visit', ar: 'استشارة عن بُعد — مبلغ ثابت', en: 'Remote consultation — fixed amount' },
    { slug: 'custom', ar: 'دفعة مخصصة — مبلغ مفتوح', en: 'Custom payment — open amount' },
  ];

  function renderDemos() {
    var isAr = window.currentLang === 'ar';
    document.getElementById('demo-links').innerHTML = DEMOS.map(function (d) {
      return '<a class="demo-link" href="/p/' + d.slug + '">' +
        '<span><span class="demo-link-name">' + (isAr ? d.ar : d.en) + '</span><br>' +
        '<span class="demo-link-url">' + location.host + '/p/' + d.slug + '</span></span>' +
        '<span class="demo-link-go">' + (isAr ? 'افتح ←' : 'Open →') + '</span></a>';
    }).join('');
  }

  document.addEventListener('langchange', renderDemos);
  initLang('ar');
  renderDemos();
</script>
</body>
</html>
